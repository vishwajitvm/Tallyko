# Tallyko — production. One server, one command:
#
#   cp .env.example .env            # then edit: DOMAIN, passwords, JWT_SECRET (see docs/17_Free_Cloud_Deployment.md)
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Caddy serves the web app and the API on https://$DOMAIN with a free, auto-renewing Let's Encrypt certificate.
# For a shop LAN with no domain, set DOMAIN=:80 and open http://<server-ip> from tablets on the same Wi-Fi.
name: tallyko-prod

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tallyko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tallyko}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  cache:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--save", "300", "1", "--loglevel", "warning", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  backend:
    build:
      context: ./backend
      target: prod
    restart: always
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tallyko}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tallyko}
      REDIS_URL: redis://cache:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      TRUST_PROXY: "true"
      TIMEZONE: ${TIMEZONE:-Asia/Kolkata}
      APP_VERSION: ${APP_VERSION:-2.0.0}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # Customer email (any SMTP account). Without SMTP_HOST emails are logged as "skipped".
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@tallyko.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Tallyko}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://${DOMAIN:-localhost}}
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    volumes:
      - api_logs:/app/TraceNestLogs
    logging: *logging

  web:
    build:
      context: ./frontend
      target: prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${DOMAIN:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
      BACKEND_UPSTREAM: backend:8000
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    logging: *logging

volumes:
  pg_data:
  redis_data:
  api_logs:
  caddy_data:
  caddy_config:
